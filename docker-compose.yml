services:
  postgres:
    image: postgres:16-alpine
    container_name: flashcards
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashcards_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: